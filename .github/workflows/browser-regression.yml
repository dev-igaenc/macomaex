name: Browser Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # KST 01:00 daily

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect regression project
        id: detect
        run: |
          if [ -f "qa/browser-regression/package.json" ]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: ${{ steps.detect.outputs.has_project == 'true' }}
        working-directory: qa/browser-regression
        run: npm install

      - name: Install Playwright browsers
        if: ${{ steps.detect.outputs.has_project == 'true' }}
        working-directory: qa/browser-regression
        run: npx playwright install --with-deps

      - name: Detect test specs
        if: ${{ steps.detect.outputs.has_project == 'true' }}
        id: specs
        run: |
          shopt -s nullglob globstar
          specs=(qa/browser-regression/tests/**/*.spec.ts qa/browser-regression/tests/**/*.spec.js)
          if [ ${#specs[@]} -gt 0 ]; then
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run browser regression tests
        if: ${{ steps.detect.outputs.has_project == 'true' && steps.specs.outputs.has_specs == 'true' }}
        working-directory: qa/browser-regression
        run: npm test

      - name: Skip message (no tests)
        if: ${{ steps.detect.outputs.has_project != 'true' || steps.specs.outputs.has_specs != 'true' }}
        run: echo "No browser regression specs found. Workflow finished without running tests."

      - name: Upload Playwright report
        if: ${{ always() && steps.detect.outputs.has_project == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            qa/browser-regression/playwright-report
            qa/browser-regression/test-results
          if-no-files-found: ignore
