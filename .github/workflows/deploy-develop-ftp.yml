name: Deploy Develop to SFTP

on:
  push:
    branches:
      - develop
    paths:
      - 'www/**'
      - '.github/workflows/deploy-develop-ftp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-develop-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy incremental www to dev server
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore tracked file mtimes
        run: |
          git ls-files -z www | while IFS= read -r -d '' file; do
            ts=$(git log -1 --format=%cI -- "$file")
            if [ -n "$ts" ] && [ -f "$file" ]; then
              touch -d "$ts" "$file"
            fi
          done

      - name: Validate SFTP settings
        env:
          CAFE24_SFTP_HOST: ${{ secrets.CAFE24_SFTP_HOST }}
          CAFE24_SFTP_PORT: ${{ secrets.CAFE24_SFTP_PORT }}
          CAFE24_SFTP_USER: ${{ secrets.CAFE24_SFTP_USER }}
          CAFE24_SFTP_PASSWORD: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          CAFE24_REMOTE_PATH: ${{ secrets.CAFE24_REMOTE_PATH }}
        run: |
          test -n "$CAFE24_SFTP_HOST" || { echo "Missing secret: CAFE24_SFTP_HOST"; exit 1; }
          test -n "$CAFE24_SFTP_PORT" || { echo "Missing secret: CAFE24_SFTP_PORT"; exit 1; }
          test -n "$CAFE24_SFTP_USER" || { echo "Missing secret: CAFE24_SFTP_USER"; exit 1; }
          test -n "$CAFE24_SFTP_PASSWORD" || { echo "Missing secret: CAFE24_SFTP_PASSWORD"; exit 1; }
          test -n "$CAFE24_REMOTE_PATH" || { echo "Missing secret: CAFE24_REMOTE_PATH"; exit 1; }

      - name: Detect Composer manifest changes
        id: composer-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            www/composer.json
            www/composer.lock

      - name: Setup PHP
        if: steps.composer-files.outputs.any_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        if: steps.composer-files.outputs.any_changed == 'true'
        working-directory: www
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy_www
          mkdir -p deploy_www
          rsync -a \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='plugin/*/key/' \
            --exclude='plugin/*/cert/' \
            --exclude='plugin/*/log/' \
            --exclude='plugin/okname/' \
            --exclude='plugin/kcpcert/' \
            --exclude='plugin/inicert/' \
            www/ deploy_www/

      - name: Show deploy target
        run: echo "Deploying ./deploy_www contents to ${{ secrets.CAFE24_REMOTE_PATH }}"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload changed files via SFTP mirror
        env:
          CAFE24_SFTP_HOST: ${{ secrets.CAFE24_SFTP_HOST }}
          CAFE24_SFTP_PORT: ${{ secrets.CAFE24_SFTP_PORT }}
          CAFE24_SFTP_USER: ${{ secrets.CAFE24_SFTP_USER }}
          CAFE24_SFTP_PASSWORD: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          CAFE24_REMOTE_PATH: ${{ secrets.CAFE24_REMOTE_PATH }}
        run: |
          lftp -u "$CAFE24_SFTP_USER","$CAFE24_SFTP_PASSWORD" "sftp://$CAFE24_SFTP_HOST:$CAFE24_SFTP_PORT" <<EOF
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          mkdir -p "$CAFE24_REMOTE_PATH"
          mirror -R --only-newer --verbose \
            --overwrite \
            ./deploy_www "$CAFE24_REMOTE_PATH"
          ls "$CAFE24_REMOTE_PATH/_head.php"
          bye
          EOF
