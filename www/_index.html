<html lang="ko" class="main">
<head>

	<meta name="HandheldFriendly" content="true"><!-- // * true : 모바일용(화면 크기 조정 기능) * false : Desktop에 최적화된 html 사용 -->
	<meta http-equiv="imagetoolbar" content="no">
	<meta name="format-detection" content="telephone=no, address=no, email=no, date=no" />

	<link rel="canonical" href="">

	<meta name="description" content="보다 나은 서비스 제공을 위해 현재 페이지 준비중에 있습니다.">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="MACOMAEX">
	<meta property="og:title" content="서비스 준비중입니다.">
	<meta property="og:url" content="">
	<meta property="og:image" content="og_images.jpg">

	<meta name="twitter:title" content="서비스 준비중입니다.">

	<title>MACOMAEX</title>
	<style>
		@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

		:root,
		html{font-size:10px;}
		*{margin:0; padding:0; box-sizing:border-box;}
		.preparing-area{width:100%; font-size:0; line-height:0; }
		.preparing-conts{width:100vw; height:calc(100vh - 16rem); display: flex; flex-direction: row; align-items: center; justify-content: center;}
		.preparing-conts img{width:46.3rem;}
		.preparing-foot{width:100vw; height:16rem; background-color: #f0f0f0; text-align: center; display: flex; flex-wrap: wrap; flex-direction: row; align-content: center; justify-content: center;}
		.preparing-foot>*{width:100%;}
		.preparing-foot>.logo{margin-bottom:2.5rem;}
		.preparing-foot>.logo img{height:3.3rem;}
		.preparing-foot>address{font-style: normal; font-family:'Pretendard', sans-serif; font-weight: 500; font-size:1.6rem; line-height:0; color: #999;}
		.preparing-foot>address strong{font-weight: 600; color: #333;}

		@media only screen and (max-width : 840px){
			:root,
			html{font-size:6.5px;}

			.preparing-foot>.logo{margin-bottom:3rem;}
			.preparing-foot>address{font-size:2rem;}
		}
	</style>
</head>
<body>
	<div class="preparing-area">
		<div class="preparing-conts"><img src="img_preparing.png" alt="서비스준비중입니다"></div>
		<div class="preparing-foot">
			<p class="logo"><img src="/img/logo.svg" alt=""></p>
			<address>COPYRIGHT &copy; 2024 <strong>MACOMAEX</strong>. ALL RIGHTS RESERVED.</address>
		</div>
	</div>
</body>
