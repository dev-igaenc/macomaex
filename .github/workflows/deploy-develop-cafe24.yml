name: Deploy Develop To Cafe24

on:
  push:
    branches:
      - develop
    paths:
      - 'www/**'
      - '.github/workflows/deploy-develop-cafe24.yml'
  workflow_dispatch:

concurrency:
  group: deploy-develop-cafe24
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files: |
            www/**
          separator: "\n"

      - name: Show changed files for deploy
        if: steps.changed.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          ADDED_MODIFIED_FILES: ${{ steps.changed.outputs.added_modified_files }}
          DELETED_FILES: ${{ steps.changed.outputs.deleted_files }}
        run: |
          ADDED_FILE_LIST="$RUNNER_TEMP/added_modified_files.txt"
          DELETED_FILE_LIST="$RUNNER_TEMP/deleted_files.txt"
          ALL_FILE_LIST="$RUNNER_TEMP/all_changed_files.txt"

          printf '%s\n' "$ADDED_MODIFIED_FILES" | sed '/^[[:space:]]*$/d' > "$ADDED_FILE_LIST"
          printf '%s\n' "$DELETED_FILES" | sed '/^[[:space:]]*$/d' > "$DELETED_FILE_LIST"
          printf '%s\n' "$ALL_CHANGED_FILES" | sed '/^[[:space:]]*$/d' > "$ALL_FILE_LIST"

          echo "Added/Modified files:"
          if [ -s "$ADDED_FILE_LIST" ]; then
            nl -ba "$ADDED_FILE_LIST"
          else
            echo "(none)"
          fi

          echo ""
          echo "Deleted files:"
          if [ -s "$DELETED_FILE_LIST" ]; then
            nl -ba "$DELETED_FILE_LIST"
          else
            echo "(none)"
          fi

          added_modified_count=0
          deleted_count=0
          all_changed_count=0

          if [ -s "$ADDED_FILE_LIST" ]; then
            added_modified_count=$(wc -l < "$ADDED_FILE_LIST" | tr -d ' ')
          fi
          if [ -s "$DELETED_FILE_LIST" ]; then
            deleted_count=$(wc -l < "$DELETED_FILE_LIST" | tr -d ' ')
          fi
          if [ -s "$ALL_FILE_LIST" ]; then
            all_changed_count=$(wc -l < "$ALL_FILE_LIST" | tr -d ' ')
          fi

          {
            echo "### Deploy file summary"
            echo ""
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Ref: $GITHUB_REF"
            echo "- SHA: $GITHUB_SHA"
            echo "- All changed under filter: $all_changed_count"
            echo "- Added/Modified: $added_modified_count"
            echo "- Deleted: $deleted_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required secrets
        env:
          DEPLOY_HOST: ${{ secrets.CAFE24_SFTP_HOST }}
          DEPLOY_PORT: ${{ secrets.CAFE24_SFTP_PORT }}
          DEPLOY_USER: ${{ secrets.CAFE24_SFTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.CAFE24_REMOTE_PATH }}
        run: |
          missing=0
          for key in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PASSWORD REMOTE_PATH; do
            eval "value=\${$key}"
            if [ -z "$value" ]; then
              echo "::error ::Missing required secret: $key"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install lftp
        if: steps.changed.outputs.any_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy changed files to Cafe24
        if: steps.changed.outputs.any_changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.CAFE24_SFTP_HOST }}
          DEPLOY_PORT: ${{ secrets.CAFE24_SFTP_PORT }}
          DEPLOY_USER: ${{ secrets.CAFE24_SFTP_USER }}
          DEPLOY_PASSWORD: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          REMOTE_PATH: ${{ secrets.CAFE24_REMOTE_PATH }}
          ADDED_MODIFIED_FILES: ${{ steps.changed.outputs.added_modified_files }}
          DELETED_FILES: ${{ steps.changed.outputs.deleted_files }}
        run: |
          CMD_FILE="$RUNNER_TEMP/lftp_cmds.txt"
          : > "$CMD_FILE"
          DEPLOY_LIST_FILE="$RUNNER_TEMP/deploy_file_list.txt"
          : > "$DEPLOY_LIST_FILE"
          UPLOAD_LIST_FILE="$RUNNER_TEMP/upload_list.txt"
          : > "$UPLOAD_LIST_FILE"
          DELETE_LIST_FILE="$RUNNER_TEMP/delete_list.txt"
          : > "$DELETE_LIST_FILE"

          {
            echo "set cmd:fail-exit yes"
            echo "set sftp:auto-confirm yes"
            echo "set net:max-retries 2"
            echo "set net:timeout 20"
            echo "set xfer:clobber on"
          } >> "$CMD_FILE"

          if [ -n "$ADDED_MODIFIED_FILES" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                www/*) ;;
                *) continue ;;
              esac
              rel="${file#www/}"
              remote_file="$REMOTE_PATH/$rel"
              remote_dir="$(dirname "$remote_file")"
              local_file="$GITHUB_WORKSPACE/$file"
              if [ ! -f "$local_file" ]; then
                echo "::error ::Local file missing: $local_file"
                exit 1
              fi
              file_size=$(wc -c < "$local_file" | tr -d ' ')
              echo "mkdir -p \"$remote_dir\"" >> "$CMD_FILE"
              echo "put -O \"$remote_dir\" \"$local_file\"" >> "$CMD_FILE"
              echo "UPLOAD $file -> $remote_file (bytes=$file_size)" >> "$DEPLOY_LIST_FILE"
              echo "$file" >> "$UPLOAD_LIST_FILE"
            done <<< "$ADDED_MODIFIED_FILES"
          fi

          if [ -n "$DELETED_FILES" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                www/*) ;;
                *) continue ;;
              esac
              rel="${file#www/}"
              remote_file="$REMOTE_PATH/$rel"
              echo "rm -f \"$remote_file\"" >> "$CMD_FILE"
              echo "DELETE $file -> $remote_file" >> "$DEPLOY_LIST_FILE"
              echo "$file" >> "$DELETE_LIST_FILE"
            done <<< "$DELETED_FILES"
          fi

          echo "bye" >> "$CMD_FILE"

          echo "Planned deploy operations:"
          if [ -s "$DEPLOY_LIST_FILE" ]; then
            cat "$DEPLOY_LIST_FILE"
          else
            echo "(none)"
          fi

          echo ""
          echo "Generated lftp command file:"
          cat "$CMD_FILE"

          upload_count=0
          delete_count=0
          if [ -s "$UPLOAD_LIST_FILE" ]; then
            upload_count=$(wc -l < "$UPLOAD_LIST_FILE" | tr -d ' ')
          fi
          if [ -s "$DELETE_LIST_FILE" ]; then
            delete_count=$(wc -l < "$DELETE_LIST_FILE" | tr -d ' ')
          fi

          {
            echo ""
            echo "### Deploy command summary"
            echo ""
            echo "- Upload commands: $upload_count"
            echo "- Delete commands: $delete_count"
            echo "- lftp command file: \`$CMD_FILE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          lftp "sftp://$DEPLOY_HOST:$DEPLOY_PORT" <<EOF
          set sftp:connect-program "ssh -a -x -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          user "$DEPLOY_USER" "$DEPLOY_PASSWORD"
          source "$CMD_FILE"
          EOF

      - name: Skip deploy (no www changes)
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "No changes under www/. Deploy skipped."
