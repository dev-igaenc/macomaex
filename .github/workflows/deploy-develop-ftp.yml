name: Deploy Develop to SFTP

on:
  push:
    branches:
      - develop
    paths:
      - 'www/**'
      - '.github/workflows/deploy-develop-ftp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-develop-ftp
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy changed files to dev server
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate SFTP settings
        env:
          CAFE24_SFTP_HOST: ${{ secrets.CAFE24_SFTP_HOST }}
          CAFE24_SFTP_PORT: ${{ secrets.CAFE24_SFTP_PORT }}
          CAFE24_SFTP_USER: ${{ secrets.CAFE24_SFTP_USER }}
          CAFE24_SFTP_PASSWORD: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          CAFE24_REMOTE_PATH: ${{ secrets.CAFE24_REMOTE_PATH }}
        run: |
          test -n "$CAFE24_SFTP_HOST" || { echo "Missing secret: CAFE24_SFTP_HOST"; exit 1; }
          test -n "$CAFE24_SFTP_PORT" || { echo "Missing secret: CAFE24_SFTP_PORT"; exit 1; }
          test -n "$CAFE24_SFTP_USER" || { echo "Missing secret: CAFE24_SFTP_USER"; exit 1; }
          test -n "$CAFE24_SFTP_PASSWORD" || { echo "Missing secret: CAFE24_SFTP_PASSWORD"; exit 1; }
          test -n "$CAFE24_REMOTE_PATH" || { echo "Missing secret: CAFE24_REMOTE_PATH"; exit 1; }

      - name: Detect changed deploy files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            www/**
            !www/data/**
            !www/logs/**
            !www/plugin/*/key/**
            !www/plugin/*/cert/**
            !www/plugin/*/log/**
            !www/plugin/okname/**
            !www/plugin/kcpcert/**
            !www/plugin/inicert/**
          separator: ","
          output_renamed_files_as_deleted_and_added: true

      - name: Detect Composer manifest changes
        id: composer-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            www/composer.json
            www/composer.lock

      - name: Setup PHP
        if: steps.composer-files.outputs.any_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        if: steps.composer-files.outputs.any_changed == 'true'
        working-directory: www
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build upload list
        id: upload-list
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          COMPOSER_CHANGED: ${{ steps.composer-files.outputs.any_changed }}
        run: |
          uploads="$CHANGED_FILES"

          if [ "$COMPOSER_CHANGED" = "true" ]; then
            if [ -n "$uploads" ]; then
              uploads="$uploads,www/vendor"
            else
              uploads="www/vendor"
            fi
          fi

          echo "files=$uploads" >> "$GITHUB_OUTPUT"

      - name: Upload changed files via SFTP
        if: steps.upload-list.outputs.files != ''
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CAFE24_SFTP_HOST }}
          username: ${{ secrets.CAFE24_SFTP_USER }}
          password: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          port: ${{ secrets.CAFE24_SFTP_PORT }}
          source: ${{ steps.upload-list.outputs.files }}
          target: ${{ secrets.CAFE24_REMOTE_PATH }}
          strip_components: 1
          overwrite: true

      - name: Remove deleted files on server
        if: steps.changed-files.outputs.any_deleted == 'true'
        uses: appleboy/ssh-action@v1
        env:
          REMOTE_PATH: ${{ secrets.CAFE24_REMOTE_PATH }}
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}
        with:
          host: ${{ secrets.CAFE24_SFTP_HOST }}
          username: ${{ secrets.CAFE24_SFTP_USER }}
          password: ${{ secrets.CAFE24_SFTP_PASSWORD }}
          port: ${{ secrets.CAFE24_SFTP_PORT }}
          envs: REMOTE_PATH,DELETED_FILES
          script: |
            set -eu
            IFS=',' read -r -a deleted_items <<< "$DELETED_FILES"
            for item in "${deleted_items[@]}"; do
              [ -n "$item" ] || continue
              remote_item="${item#www/}"
              rm -rf "$REMOTE_PATH/$remote_item"
              echo "Removed $REMOTE_PATH/$remote_item"
            done
